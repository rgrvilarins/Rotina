<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina</title>
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#F2F2F7;--card:#fff;--ink:#000;--mute:#8E8E93;--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--blue:#007AFF;--h1:#1E8CFF;--h2:#5E5CE6;--hi:#FF3B30;--md:#FF9500;--lo:#34C759;--shadow:0 1px 2px rgba(0,0,0,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1C1C1E;--ink:#fff;--mute:#8E8E93;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--blue:#0A84FF;--h1:#0A6FE0;--h2:#4B49C8;--hi:#FF453A;--md:#FF9F0A;--lo:#30D158;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--ink:#fff;--mute:#8E8E93;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--blue:#0A84FF;--h1:#0A6FE0;--h2:#4B49C8;--hi:#FF453A;--md:#FF9F0A;--lo:#30D158;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;font-weight:400;line-height:1.3;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 150px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.date{color:var(--mute);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:34px;font-weight:700;margin:2px 0 0;letter-spacing:-.025em}
.theme{width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:16px;color:var(--blue)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(155deg,var(--h1),var(--h2));display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 14px 30px rgba(10,100,255,.28)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.34),transparent 55%);pointer-events:none}
.hero>*{position:relative}
.hl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hn{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
.hs{font-size:15px;opacity:.92}
.ring{position:relative;flex:none;width:76px;height:76px}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 8px}
.bar b{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lnk{color:var(--blue);font-size:17px}
.bar .lnk{font-size:15px}
.segc{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:2px}
.segc button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s}
.segc button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.14);color:var(--c,var(--ink))}
#modes{overflow-x:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
#modes button{flex:0 0 auto;padding:8px 16px}
section{margin-top:26px}
section.empty{display:none}
body.dragging section.empty{display:block}
h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 7px 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
h2 .dot{width:9px;height:9px;border-radius:50%}
h2 small{font-weight:400;text-transform:none;letter-spacing:0}
.list{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.list.empty{min-height:58px;background:transparent;border:2px dashed var(--sep)}
.task{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.task:not(:last-child)::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--sep)}
.task.lift{z-index:50;border-radius:14px;transform:scale(1.03);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.task.lift::after{display:none}
.ph{background:rgba(0,122,255,.14)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800;transition:background .2s}
.task.done .check{background:var(--c);color:#fff}
.check.pop{animation:pop .32s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.txt{flex:1;min-width:0;text-align:left}
.txt strong{display:block;font-weight:400;font-size:17px;overflow-wrap:anywhere}
.txt em{font-style:normal;color:var(--mute);font-size:13px}
.task.done .txt strong{text-decoration:line-through;color:var(--mute)}
.tm{flex:none;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.empty-msg{padding:48px 10px;text-align:center;color:var(--mute)}
.cta-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30}
.glow{position:absolute;inset:-4px;border-radius:34px;background:conic-gradient(from var(--a),#0A84FF,#BF5AF2,#FF375F,#FF9F0A,#30D158,#0A84FF);filter:blur(12px);opacity:.8;animation:spin 5s linear infinite}
@keyframes spin{to{--a:360deg}}
.cta{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:56px;padding:0 30px;border-radius:28px;color:#fff;font-weight:600;font-size:17px;background:linear-gradient(160deg,#2B95FF,#5E5CE6);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 6px rgba(0,0,0,.18);overflow:hidden;transition:transform .15s}
.cta:active{transform:scale(.95)}
.cta span{font-size:26px;font-weight:300;line-height:1;margin-top:-2px}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);background-size:260% 100%;background-position:160% 0;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
@media (prefers-reduced-motion:reduce){.glow,.cta::after,.check.pop{animation:none}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.scrim.on{display:flex}
.scrim.on .sheet{animation:up .34s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet{width:100%;max-width:560px;max-height:93vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 6px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}
.nav b{font-size:17px;font-weight:600}
.bold{font-weight:600}
.cap{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;margin:18px 6px 7px}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin-top:14px}
.cap+.grp,.cap+.segc{margin-top:0}
.grp input[type=text]{width:100%;padding:14px 16px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;font-size:17px;text-align:left;min-height:46px}
.frow+.frow{border-top:.5px solid var(--sep)}
.frow input[type=time]{border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:16px;padding:6px 10px;border-radius:8px}
.frow.red{color:var(--hi);justify-content:center}
.frow .ck{color:var(--blue);font-weight:700}
.x{width:22px;height:22px;border-radius:50%;background:var(--fill);color:var(--mute);font-size:14px;line-height:1;margin-left:6px}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill);transition:background .2s;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--lo)}
.sw[aria-checked="true"] i{transform:translateX(20px)}
.hint{font-size:13px;color:var(--mute);margin:0 6px 4px}
.mrow{display:flex;align-items:center;gap:10px;padding:4px 16px 4px 12px}
.mrow+.mrow{border-top:.5px solid var(--sep)}
.mrow input{flex:1;padding:12px 0!important}
.minus{flex:none;width:24px;height:24px;border-radius:50%;background:var(--hi);color:#fff;font-weight:700;line-height:1;font-size:18px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="hello"></h1></div>
    <button class="theme" id="theme" aria-label="Alternar tema">◐</button>
  </div>
  <div class="hero">
    <div><div class="hl" id="hl"></div><div class="hn" id="hn"></div><div class="hs" id="hs"></div></div>
    <div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="7"/><circle id="ringfg" cx="38" cy="38" r="30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 38 38)" style="transition:stroke-dashoffset .5s"/></svg><div id="rc"></div></div>
  </div>
  <div class="bar"><b>Rotina</b><button class="lnk" id="editModes">Editar</button></div>
  <div class="segc" id="modes"></div>
  <div id="lists"></div>
</main>

<div class="cta-wrap"><i class="glow"></i><button class="cta" id="add"><span>+</span>Nova tarefa</button></div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-label="Tarefa">
    <div class="grab"></div>
    <div class="nav"><button class="lnk" id="cancel">Cancelar</button><b id="sheetTitle">Nova tarefa</b><button class="lnk bold" id="save">Salvar</button></div>
    <div class="grp" style="margin-top:0"><input type="text" id="title" placeholder="Título" maxlength="80"></div>
    <div class="cap">Prioridade</div><div class="segc" id="pri"></div>
    <div class="grp">
      <div class="frow"><span>Horário</span><span style="display:flex;align-items:center"><input type="time" id="time"><button class="x" id="clrT" aria-label="Limpar horário">×</button></span></div>
      <div class="frow"><span>Repetir todo dia</span><button class="sw" id="daily" role="switch" aria-checked="false" aria-label="Repetir todo dia"><i></i></button></div>
    </div>
    <div class="cap">Avisar</div><div class="segc" id="remind"></div>
    <div class="cap">Aparece em (nenhuma marcada = todas)</div><div class="grp" id="mseg" style="margin-top:0"></div>
    <div class="grp" id="remGrp"><button class="frow red" id="remove">Excluir tarefa</button></div>
  </div>
</div>

<div class="scrim" id="mscrim">
  <div class="sheet" role="dialog" aria-label="Rotinas">
    <div class="grab"></div>
    <div class="nav"><span style="width:60px"></span><b>Rotinas</b><button class="lnk bold" id="mdone">OK</button></div>
    <p class="hint">Cada rotina mostra só as tarefas dela, e as notificações seguem a rotina ativa.</p>
    <div class="grp" id="mlist"></div>
    <div class="grp"><button class="frow lnk" id="addMode">Adicionar rotina</button></div>
  </div>
</div>

<script>
const PRI={alta:{n:"Alta prioridade",s:"Alta",v:"--hi"},media:{n:"Média prioridade",s:"Média",v:"--md"},baixa:{n:"Baixa prioridade",s:"Baixa",v:"--lo"}};
const REMINDS=[{v:0,label:"Na hora"},{v:5,label:"5 min"},{v:15,label:"15 min"},{v:30,label:"30 min"}];
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString("sv-SE");
const uid=()=>Math.random().toString(36).slice(2,9);
const nid=()=>1+Math.floor(Math.random()*2000000000);
let tasks=[],modes=[],cur="all",form={};
let drag=null,pressT=null,sx=0,sy=0,lastDrag=0,justDone=null;

function seed(){return[
 {t:"Levar a filha à escola",p:"alta",time:"07:00",daily:true,modes:["m1"],o:10},
 {t:"Bater ponto",p:"alta",time:"08:00",daily:true,modes:["m1"],o:20},
 {t:"Buscar a filha na escola",p:"alta",time:"17:30",daily:true,modes:["m1"],o:30},
 {t:"Dar banho na filha",p:"media",time:"19:30",daily:true,modes:[],o:10},
 {t:"Ir ao mercado",p:"media",time:"",daily:false,modes:["m2"],o:20},
 {t:"Comprar leite",p:"baixa",time:"",daily:false,modes:["m2"],o:10}
].map(x=>({...x,id:uid(),nid:nid(),remind:0,done:false,doneOn:""}))}
function load(){
 try{const s=localStorage.getItem("rotina.v3");
  if(s)tasks=JSON.parse(s);
  else{const old=localStorage.getItem("rotina.v2");
   tasks=old?JSON.parse(old).map((t,i)=>({...t,o:(i+1)*10,modes:[]})):seed()}
 }catch(e){tasks=seed()}
 tasks.forEach(t=>{if(!t.modes)t.modes=[];if(t.o==null)t.o=0;if(t.daily&&t.done&&t.doneOn!==today())t.done=false});
 try{const m=localStorage.getItem("rotina.modes");
  modes=m?JSON.parse(m):[{id:"m1",name:"Dia de escola"},{id:"m2",name:"Fim de semana"}];
  cur=localStorage.getItem("rotina.cur")||"all";
 }catch(e){modes=[]}
 if(cur!=="all"&&!modes.some(m=>m.id===cur))cur="all";
}
function save(){try{localStorage.setItem("rotina.v3",JSON.stringify(tasks))}catch(e){}schedule()}
function saveModes(){try{localStorage.setItem("rotina.modes",JSON.stringify(modes));localStorage.setItem("rotina.cur",cur)}catch(e){}}
const inMode=t=>cur==="all"||!t.modes.length||t.modes.includes(cur);

/* Notificações (só das tarefas da rotina ativa) */
const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
async function schedule(){
 if(!LN)return;
 try{
  let p=await LN.checkPermissions();
  if(p.display!=="granted")p=await LN.requestPermissions();
  if(p.display!=="granted")return;
  const pend=await LN.getPending();
  if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const list=[],now=new Date();
  tasks.filter(inMode).forEach(t=>{
   if(!t.time)return;
   const[h,m]=t.time.split(":").map(Number);
   let tot=h*60+m-(t.remind||0);if(tot<0)tot+=1440;
   const hh=Math.floor(tot/60),mm=tot%60;
   const body=t.remind?"Em "+t.remind+" min, às "+t.time:"Agora, às "+t.time;
   if(t.daily)list.push({id:t.nid,title:t.t,body,schedule:{on:{hour:hh,minute:mm},allowWhileIdle:true}});
   else if(!t.done){const at=new Date();at.setHours(hh,mm,0,0);if(at>now)list.push({id:t.nid,title:t.t,body,schedule:{at,allowWhileIdle:true}})}
  });
  if(list.length)await LN.schedule({notifications:list});
 }catch(e){}
}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function hero(mt){
 const done=mt.filter(t=>t.done).length,tot=mt.length,pend=mt.filter(t=>!t.done);
 $("rc").textContent=done+"/"+tot;
 $("ringfg").style.strokeDashoffset=188.5*(1-(tot?done/tot:0));
 if(!tot){$("hl").textContent="Sem tarefas";$("hn").textContent="Toque em Nova tarefa";$("hs").textContent="";return}
 if(!pend.length){$("hl").textContent="Dia completo";$("hn").textContent="Tudo concluído";$("hs").textContent="Aproveite o descanso";return}
 const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 const timed=pend.filter(t=>t.time).map(t=>{const[a,b]=t.time.split(":").map(Number);return{t,m:a*60+b-nm}}).filter(x=>x.m>=-30).sort((a,b)=>a.m-b.m);
 if(timed.length){const x=timed[0];$("hl").textContent="Próxima tarefa";$("hn").textContent=x.t.t;
  $("hs").textContent=(x.m<=0?"agora":"em "+(x.m>=60?Math.floor(x.m/60)+"h"+(x.m%60?" "+x.m%60+"min":""):x.m+" min"))+" · "+x.t.time}
 else{const f=[...pend].sort((a,b)=>Object.keys(PRI).indexOf(a.p)-Object.keys(PRI).indexOf(b.p)||a.o-b.o)[0];
  $("hl").textContent="A fazer";$("hn").textContent=f.t;$("hs").textContent=pend.length+" pendentes"}
}

function render(){
 const d=new Date(),h=d.getHours();
 $("date").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
 $("hello").textContent=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
 const mw=$("modes");mw.replaceChildren();
 [{id:"all",name:"Tudo"},...modes].forEach(m=>{const b=el("button",null,m.name);b.setAttribute("aria-pressed",cur===m.id);
  b.onclick=()=>{cur=m.id;saveModes();render();schedule()};mw.append(b)});
 const mt=tasks.filter(inMode);hero(mt);
 const box=$("lists");box.replaceChildren();
 if(!mt.length){box.append(el("div","empty-msg","Nada por aqui. Toque em Nova tarefa para começar."));return}
 Object.keys(PRI).forEach(k=>{
  const items=mt.filter(t=>t.p===k).sort((a,b)=>(a.done-b.done)||(a.o-b.o));
  const s=document.createElement("section");if(!items.length)s.className="empty";
  const h2=el("h2"),dot=el("span","dot");dot.style.background="var("+PRI[k].v+")";
  h2.append(dot,PRI[k].n+" ",el("small",null,items.filter(t=>!t.done).length+" pendentes"));
  const list=el("div","list"+(items.length?"":" empty"));list.dataset.p=k;
  items.forEach(t=>{
   const row=el("div","task"+(t.done?" done":""));row.style.setProperty("--c","var("+PRI[k].v+")");row.dataset.id=t.id;
   const ck=el("button","check"+(justDone===t.id?" pop":""),"✓");ck.setAttribute("aria-label","Concluir "+t.t);
   ck.onclick=()=>{t.done=!t.done;t.doneOn=t.done?today():"";justDone=t.done?t.id:null;if(t.done&&navigator.vibrate)navigator.vibrate(12);save();render();justDone=null};
   const tg=el("button","txt");tg.append(el("strong",null,t.t));if(t.daily)tg.append(el("em",null,"Todo dia"));
   tg.onclick=()=>{if(Date.now()-lastDrag>500)openSheet(t)};
   row.append(ck,tg,el("span","tm",t.time||""));bindDrag(row,t);list.append(row)});
  s.append(h2,list);box.append(s)});
}

/* Arrastar (segurar e mover) */
function bindDrag(row,t){
 row.addEventListener("touchstart",e=>{
  if(e.target.closest(".check"))return;
  const tc=e.touches[0];sx=tc.clientX;sy=tc.clientY;clearTimeout(pressT);
  pressT=setTimeout(()=>startDrag(row,t,sy),380);
 },{passive:true});
 row.addEventListener("touchmove",e=>{if(drag)return;const tc=e.touches[0];if(Math.abs(tc.clientX-sx)>8||Math.abs(tc.clientY-sy)>8)clearTimeout(pressT)},{passive:true});
 row.addEventListener("touchend",()=>clearTimeout(pressT));
 row.addEventListener("touchcancel",()=>clearTimeout(pressT));
 row.addEventListener("contextmenu",e=>e.preventDefault());
}
function startDrag(row,t,y){
 const r=row.getBoundingClientRect();
 const ph=el("div","ph");ph.style.height=r.height+"px";
 drag={row,t,ph,oy:y-r.top,y};
 row.after(ph);
 row.classList.add("lift");
 row.style.position="fixed";row.style.left=r.left+"px";row.style.top=r.top+"px";row.style.width=r.width+"px";
 document.body.classList.add("dragging");
 if(navigator.vibrate)navigator.vibrate(20);
 loop();
}
function moveDrag(y){
 if(!drag)return;drag.y=y;
 drag.row.style.top=(y-drag.oy)+"px";
 let best=null,bd=1e9;
 document.querySelectorAll(".list").forEach(l=>{const b=l.getBoundingClientRect();const d=y<b.top?b.top-y:y>b.bottom?y-b.bottom:0;if(d<bd){bd=d;best=l}});
 if(!best)return;
 const kids=[...best.children].filter(c=>c!==drag.row&&c!==drag.ph);
 let before=null;
 for(const k of kids){const b=k.getBoundingClientRect();if(y<b.top+b.height/2){before=k;break}}
 if(before)best.insertBefore(drag.ph,before);else best.appendChild(drag.ph);
}
function loop(){
 if(!drag)return;
 if(drag.y<110){scrollBy(0,-14);moveDrag(drag.y)}
 else if(drag.y>innerHeight-110){scrollBy(0,14);moveDrag(drag.y)}
 requestAnimationFrame(loop);
}
function endDrag(){
 if(!drag)return;
 const{row,t,ph}=drag;drag=null;lastDrag=Date.now();
 const list=ph.parentElement;
 if(list){
  const sib=[...list.children].filter(c=>c!==row),i=sib.indexOf(ph);
  const find=n=>n&&n.dataset?tasks.find(x=>x.id===n.dataset.id):null;
  const prev=find(sib[i-1]),next=find(sib[i+1]);
  t.p=list.dataset.p;
  t.o=prev&&next?(prev.o+next.o)/2:prev?prev.o+10:next?next.o-10:t.o;
 }
 document.body.classList.remove("dragging");
 save();render();
}
document.addEventListener("touchmove",e=>{if(!drag)return;e.preventDefault();moveDrag(e.touches[0].clientY)},{passive:false});
document.addEventListener("touchend",endDrag);
document.addEventListener("touchcancel",endDrag);

/* Formulário da tarefa */
function segc(id,opts,key){const w=$(id);w.replaceChildren();
 opts.forEach(o=>{const b=el("button",null,o.label);if(o.cv)b.style.setProperty("--c","var("+o.cv+")");
  b.setAttribute("aria-pressed",form[key]===o.v);b.onclick=()=>{form[key]=o.v;segc(id,opts,key)};w.append(b)})}
function drawM(){const w=$("mseg");w.replaceChildren();
 modes.forEach(m=>{const on=form.modes.includes(m.id);const b=el("button","frow");b.append(el("span",null,m.name),el("span","ck",on?"✓":""));
  b.onclick=()=>{const i=form.modes.indexOf(m.id);if(i<0)form.modes.push(m.id);else form.modes.splice(i,1);drawM()};w.append(b)});
 if(!modes.length){const r=el("div","frow");r.style.color="var(--mute)";r.textContent="Nenhuma rotina criada";w.append(r)}}
function setDaily(){$("daily").setAttribute("aria-checked",form.daily)}
function openSheet(t){
 form=t?{id:t.id,p:t.p,remind:t.remind||0,daily:t.daily,modes:[...t.modes]}
       :{id:null,p:"media",remind:0,daily:false,modes:cur==="all"?[]:[cur]};
 $("sheetTitle").textContent=t?"Editar tarefa":"Nova tarefa";
 $("title").value=t?t.t:"";$("time").value=t?t.time:"";
 $("remGrp").style.display=t?"block":"none";
 segc("pri",Object.keys(PRI).map(k=>({v:k,label:PRI[k].s,cv:PRI[k].v})),"p");
 segc("remind",REMINDS,"remind");drawM();setDaily();
 $("scrim").classList.add("on");
 if(!t)setTimeout(()=>$("title").focus(),50)}
const closeSheet=()=>$("scrim").classList.remove("on");
$("add").onclick=()=>openSheet(null);
$("cancel").onclick=closeSheet;
$("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};
$("daily").onclick=()=>{form.daily=!form.daily;setDaily()};
$("clrT").onclick=()=>{$("time").value=""};
$("save").onclick=()=>{
 const t=$("title").value.trim();if(!t){$("title").focus();return}
 const time=$("time").value;
 if(form.id){const x=tasks.find(z=>z.id===form.id);Object.assign(x,{t,p:form.p,time,remind:form.remind,daily:form.daily,modes:form.modes,done:false,doneOn:""})}
 else{const mx=tasks.reduce((a,z)=>Math.max(a,z.o),0);tasks.push({id:uid(),nid:nid(),t,p:form.p,time,remind:form.remind,daily:form.daily,modes:form.modes,o:mx+10,done:false,doneOn:""})}
 save();closeSheet();render()};
$("remove").onclick=()=>{tasks=tasks.filter(x=>x.id!==form.id);save();closeSheet();render()};

/* Rotinas */
function drawML(){const w=$("mlist");w.replaceChildren();
 modes.forEach(m=>{const r=el("div","mrow");
  const d=el("button","minus","−");d.setAttribute("aria-label","Excluir rotina");
  d.onclick=()=>{modes=modes.filter(x=>x.id!==m.id);tasks.forEach(t=>{t.modes=t.modes.filter(i=>i!==m.id)});if(cur===m.id)cur="all";saveModes();save();drawML()};
  const n=el("input");n.type="text";n.value=m.name;n.maxLength=24;n.oninput=()=>{m.name=n.value;saveModes()};
  r.append(d,n);w.append(r)});
 if(!modes.length){const r=el("div","frow");r.style.color="var(--mute)";r.textContent="Nenhuma rotina criada";w.append(r)}}
function openModes(){drawML();$("mscrim").classList.add("on")}
$("editModes").onclick=openModes;
$("addMode").onclick=()=>{modes.push({id:"m"+uid(),name:"Nova rotina"});saveModes();drawML()};
$("mdone").onclick=()=>{$("mscrim").classList.remove("on");render();schedule()};
$("mscrim").onclick=e=>{if(e.target.id==="mscrim")$("mdone").onclick()};

$("theme").onclick=()=>{const r=document.documentElement;
 const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("rotina.theme",r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem("rotina.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
load();render();schedule();
setInterval(()=>{if(!drag)hero(tasks.filter(inMode))},60000);
</script>
