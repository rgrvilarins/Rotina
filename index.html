<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina</title>
<style>
:root{--bg:#EEF1F7;--surface:#fff;--ink:#12172E;--mute:#69708C;--line:#E4E8F1;--accent:#4A5BF0;--on-accent:#fff;--h1:#4A5BF0;--h2:#8A5CF6;--hi:#F0525A;--md:#E8962A;--lo:#2FA38E;--shadow:0 6px 20px rgba(30,40,110,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0E1C;--surface:#161A2E;--ink:#EEF0FA;--mute:#9199B8;--line:#252A45;--accent:#7C8CFF;--on-accent:#0B0E1C;--h1:#3340C8;--h2:#6B3FD6;--hi:#FF7A7F;--md:#F0B253;--lo:#4FC3B0;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0E1C;--surface:#161A2E;--ink:#EEF0FA;--mute:#9199B8;--line:#252A45;--accent:#7C8CFF;--on-accent:#0B0E1C;--h1:#3340C8;--h2:#6B3FD6;--hi:#FF7A7F;--md:#F0B253;--lo:#4FC3B0;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 130px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center}
.date{color:var(--mute);font-size:14px;text-transform:capitalize}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.03em}
.theme{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.hero{margin-top:18px;border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 12px 28px rgba(74,91,240,.28)}
.hl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.hn{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
.hs{font-size:14px;opacity:.9}
.ring{position:relative;flex:none;width:76px;height:76px}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px}
.modes,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.modes{padding:18px 0 4px}.chips{padding:8px 0 2px}
.modes::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;color:var(--mute);font-weight:600}
.modes .chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff}
.chips .chip{box-shadow:none;border:1px solid var(--line);font-size:13px;padding:6px 12px}
.chips .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-top:24px}
section.empty{display:none}
body.dragging section.empty{display:block}
h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:0 0 10px 4px;letter-spacing:.01em}
h2 .dot{width:10px;height:10px;border-radius:50%}
h2 small{color:var(--mute);font-weight:500}
.list{display:flex;flex-direction:column;gap:10px}
.list.empty{min-height:62px;border:2px dashed var(--line);border-radius:18px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;background:var(--surface);border-radius:18px;box-shadow:inset 4px 0 0 var(--c),var(--shadow);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.task.lift{z-index:50;transform:scale(1.03);box-shadow:inset 4px 0 0 var(--c),0 16px 36px rgba(20,25,90,.3)}
.ph{border:2px dashed var(--accent);border-radius:18px;opacity:.55}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800}
.task.done .check{background:var(--c);color:var(--surface)}
.check.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ico{flex:none;width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px}
.txt{flex:1;min-width:0;text-align:left}
.txt strong{display:block;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.txt em{font-style:normal;color:var(--mute);font-size:13px}
.task.done .txt strong{text-decoration:line-through;color:var(--mute)}
.task.done .ico{opacity:.5}
.empty-msg{padding:40px 10px;text-align:center;color:var(--mute)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:22px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font-size:32px;box-shadow:0 10px 26px rgba(74,91,240,.4)}
.scrim{position:fixed;inset:0;background:rgba(8,10,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.scrim.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=time]{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--c,var(--accent));background:var(--c,var(--accent));color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.save{width:100%;margin-top:20px;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font-weight:800;font-size:16px}
.remove{width:100%;margin-top:8px;padding:14px;border-radius:16px;color:var(--hi);font-weight:600}
.mrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.mrow input:first-child{width:64px;text-align:center}
.mrow .del{flex:none;width:40px;height:40px;font-size:22px;color:var(--hi)}
.hint{font-size:13px;color:var(--mute);margin:0 0 14px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="hello"></h1></div>
    <button class="theme" id="theme" aria-label="Alternar tema">◐</button>
  </div>
  <div class="hero">
    <div><div class="hl" id="hl"></div><div class="hn" id="hn"></div><div class="hs" id="hs"></div></div>
    <div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/><circle id="ringfg" cx="38" cy="38" r="30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 38 38)" style="transition:stroke-dashoffset .5s"/></svg><div id="rc"></div></div>
  </div>
  <div class="modes" id="modes"></div>
  <div class="chips" id="chips"></div>
  <div id="lists"></div>
</main>
<button class="fab" id="add" aria-label="Nova tarefa">+</button>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-label="Tarefa">
    <h3 id="sheetTitle">Nova tarefa</h3>
    <input type="text" id="title" placeholder="O que precisa ser feito?" maxlength="80">
    <label>Prioridade</label><div class="seg" id="pri"></div>
    <label>Categoria</label><div class="seg" id="cat"></div>
    <input type="text" id="newcat" placeholder="Ou crie uma nova categoria" maxlength="20" style="margin-top:8px">
    <label>Aparece em (nenhum marcado = todos os modos)</label><div class="seg" id="mseg"></div>
    <label for="time">Horário (opcional)</label><input type="time" id="time">
    <label>Avisar</label><div class="seg" id="remind"></div>
    <div class="row"><span>Repetir todos os dias</span><button class="chip" id="daily" aria-pressed="false">Não</button></div>
    <button class="save" id="save">Salvar tarefa</button>
    <button class="remove" id="remove">Excluir tarefa</button>
  </div>
</div>

<div class="scrim" id="mscrim">
  <div class="sheet" role="dialog" aria-label="Modos">
    <h3>Modos de rotina</h3>
    <p class="hint">Cada modo mostra só as tarefas dele. Notificações também seguem o modo ativo.</p>
    <div id="mlist"></div>
    <button class="chip" id="addMode" style="margin-top:4px">+ Novo modo</button>
    <button class="save" id="mdone">Pronto</button>
  </div>
</div>

<script>
const PRI={alta:{n:"Alta prioridade",s:"Alta",v:"--hi"},media:{n:"Média prioridade",s:"Média",v:"--md"},baixa:{n:"Baixa prioridade",s:"Baixa",v:"--lo"}};
const DEF_CATS=["Trabalho","Filha","Casa","Compras"];
const CI={Trabalho:"💼",Filha:"🧸",Casa:"🏠",Compras:"🛒"};
const REMINDS=[{v:0,label:"Na hora"},{v:5,label:"5 min antes"},{v:15,label:"15 min antes"},{v:30,label:"30 min antes"}];
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString("sv-SE");
const uid=()=>Math.random().toString(36).slice(2,9);
const nid=()=>1+Math.floor(Math.random()*2000000000);
const icon=c=>CI[c]||(c?"🏷️":"•");
let tasks=[],modes=[],cur="all",filter="Todas",form={},catList=[],editCats=false;
let drag=null,pressT=null,sx=0,sy=0,lastDrag=0,justDone=null;

function seed(){return[
 {t:"Levar a filha à escola",p:"alta",c:"Filha",time:"07:00",daily:true,modes:["m1"],o:10},
 {t:"Bater ponto",p:"alta",c:"Trabalho",time:"08:00",daily:true,modes:["m1"],o:20},
 {t:"Buscar a filha na escola",p:"alta",c:"Filha",time:"17:30",daily:true,modes:["m1"],o:30},
 {t:"Dar banho na filha",p:"media",c:"Filha",time:"19:30",daily:true,modes:[],o:10},
 {t:"Ir ao mercado",p:"media",c:"Compras",time:"",daily:false,modes:["m2"],o:20},
 {t:"Comprar leite",p:"baixa",c:"Compras",time:"",daily:false,modes:["m2"],o:10}
].map(x=>({...x,id:uid(),nid:nid(),remind:0,done:false,doneOn:""}))}
function load(){
 try{const s=localStorage.getItem("rotina.v3");
  if(s)tasks=JSON.parse(s);
  else{const old=localStorage.getItem("rotina.v2");
   tasks=old?JSON.parse(old).map((t,i)=>({...t,o:(i+1)*10,modes:[]})):seed()}
 }catch(e){tasks=seed()}
 tasks.forEach(t=>{if(!t.modes)t.modes=[];if(t.o==null)t.o=0;if(t.daily&&t.done&&t.doneOn!==today())t.done=false});
 try{const m=localStorage.getItem("rotina.modes");
  modes=m?JSON.parse(m):[{id:"m1",name:"Dia de escola",emoji:"🎒"},{id:"m2",name:"Fim de semana",emoji:"🏖️"}];
  cur=localStorage.getItem("rotina.cur")||"all";
 }catch(e){modes=[]}
 if(cur!=="all"&&!modes.some(m=>m.id===cur))cur="all";
 try{const v=localStorage.getItem("rotina.cats");catList=v?JSON.parse(v):[...new Set([...DEF_CATS,...tasks.map(t=>t.c).filter(Boolean)])]}catch(e){catList=[...DEF_CATS]}
}
function save(){try{localStorage.setItem("rotina.v3",JSON.stringify(tasks))}catch(e){}schedule()}
function saveModes(){try{localStorage.setItem("rotina.modes",JSON.stringify(modes));localStorage.setItem("rotina.cur",cur)}catch(e){}}
function saveCats(){try{localStorage.setItem("rotina.cats",JSON.stringify(catList))}catch(e){}}
const cats=()=>catList;
const inMode=t=>cur==="all"||!t.modes.length||t.modes.includes(cur);

/* Notificações (só das tarefas do modo ativo) */
const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
async function schedule(){
 if(!LN)return;
 try{
  let p=await LN.checkPermissions();
  if(p.display!=="granted")p=await LN.requestPermissions();
  if(p.display!=="granted")return;
  const pend=await LN.getPending();
  if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const list=[],now=new Date();
  tasks.filter(inMode).forEach(t=>{
   if(!t.time)return;
   const[h,m]=t.time.split(":").map(Number);
   let tot=h*60+m-(t.remind||0);if(tot<0)tot+=1440;
   const hh=Math.floor(tot/60),mm=tot%60;
   const body=t.remind?"Em "+t.remind+" min, às "+t.time:"Agora, às "+t.time;
   if(t.daily)list.push({id:t.nid,title:t.t,body,schedule:{on:{hour:hh,minute:mm},allowWhileIdle:true}});
   else if(!t.done){const at=new Date();at.setHours(hh,mm,0,0);if(at>now)list.push({id:t.nid,title:t.t,body,schedule:{at,allowWhileIdle:true}})}
  });
  if(list.length)await LN.schedule({notifications:list});
 }catch(e){}
}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function hero(mt){
 const done=mt.filter(t=>t.done).length,tot=mt.length,pend=mt.filter(t=>!t.done);
 $("rc").textContent=done+"/"+tot;
 $("ringfg").style.strokeDashoffset=188.5*(1-(tot?done/tot:0));
 if(!tot){$("hl").textContent="Sem tarefas";$("hn").textContent="Toque em + para começar";$("hs").textContent="";return}
 if(!pend.length){$("hl").textContent="Dia completo";$("hn").textContent="Tudo concluído 🎉";$("hs").textContent="Aproveite o descanso";return}
 const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 const timed=pend.filter(t=>t.time).map(t=>{const[a,b]=t.time.split(":").map(Number);return{t,m:a*60+b-nm}}).filter(x=>x.m>=-30).sort((a,b)=>a.m-b.m);
 if(timed.length){const x=timed[0];$("hl").textContent="Próxima tarefa";$("hn").textContent=x.t.t;
  $("hs").textContent=(x.m<=0?"agora":"em "+(x.m>=60?Math.floor(x.m/60)+"h"+(x.m%60?" "+x.m%60+"min":""):x.m+" min"))+" · "+x.t.time}
 else{const f=[...pend].sort((a,b)=>Object.keys(PRI).indexOf(a.p)-Object.keys(PRI).indexOf(b.p)||a.o-b.o)[0];
  $("hl").textContent="A fazer";$("hn").textContent=f.t;$("hs").textContent=pend.length+" pendentes"}
}

function render(){
 const d=new Date(),h=d.getHours();
 $("date").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
 $("hello").textContent=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
 if(filter!=="Todas"&&!cats().includes(filter))filter="Todas";
 const mw=$("modes");mw.replaceChildren();
 [{id:"all",name:"Tudo",emoji:"✨"},...modes].forEach(m=>{const b=el("button","chip",m.emoji+" "+m.name);b.setAttribute("aria-pressed",cur===m.id);
  b.onclick=()=>{cur=m.id;saveModes();render();schedule()};mw.append(b)});
 const eb=el("button","chip","✎");eb.setAttribute("aria-label","Gerenciar modos");eb.onclick=openModes;mw.append(eb);
 const mt=tasks.filter(inMode);hero(mt);
 const chips=$("chips");chips.replaceChildren();
 ["Todas",...cats()].forEach(c=>{const b=el("button","chip",c==="Todas"?c:icon(c)+" "+c);b.setAttribute("aria-pressed",c===filter);b.onclick=()=>{filter=c;render()};chips.append(b)});
 const box=$("lists");box.replaceChildren();
 const vis=mt.filter(t=>filter==="Todas"||t.c===filter);
 if(!vis.length){box.append(el("div","empty-msg","Nada por aqui. Toque em + para adicionar uma tarefa."));return}
 Object.keys(PRI).forEach(k=>{
  const items=vis.filter(t=>t.p===k).sort((a,b)=>(a.done-b.done)||(a.o-b.o));
  const s=document.createElement("section");if(!items.length)s.className="empty";
  const h2=el("h2"),dot=el("span","dot");dot.style.background="var("+PRI[k].v+")";
  h2.append(dot,PRI[k].n+" ",el("small",null,items.filter(t=>!t.done).length+" pendentes"));
  const list=el("div","list"+(items.length?"":" empty"));list.dataset.p=k;
  items.forEach(t=>{
   const row=el("div","task"+(t.done?" done":""));row.style.setProperty("--c","var("+PRI[k].v+")");row.dataset.id=t.id;
   const ck=el("button","check"+(justDone===t.id?" pop":""),"✓");ck.setAttribute("aria-label","Concluir "+t.t);
   ck.onclick=()=>{t.done=!t.done;t.doneOn=t.done?today():"";justDone=t.done?t.id:null;if(t.done&&navigator.vibrate)navigator.vibrate(12);save();render();justDone=null};
   const ic=el("span","ico",icon(t.c));
   const tg=el("button","txt");
   tg.append(el("strong",null,t.t),el("em",null,[t.time,t.c,t.daily?"todo dia":""].filter(Boolean).join(" · ")));
   tg.onclick=()=>{if(Date.now()-lastDrag>500)openSheet(t)};
   row.append(ck,ic,tg);bindDrag(row,t);list.append(row)});
  s.append(h2,list);box.append(s)});
}

/* Arrastar (segurar e mover) */
function bindDrag(row,t){
 row.addEventListener("touchstart",e=>{
  if(e.target.closest(".check"))return;
  const tc=e.touches[0];sx=tc.clientX;sy=tc.clientY;clearTimeout(pressT);
  pressT=setTimeout(()=>startDrag(row,t,sy),380);
 },{passive:true});
 row.addEventListener("touchmove",e=>{if(drag)return;const tc=e.touches[0];if(Math.abs(tc.clientX-sx)>8||Math.abs(tc.clientY-sy)>8)clearTimeout(pressT)},{passive:true});
 row.addEventListener("touchend",()=>clearTimeout(pressT));
 row.addEventListener("touchcancel",()=>clearTimeout(pressT));
 row.addEventListener("contextmenu",e=>e.preventDefault());
}
function startDrag(row,t,y){
 const r=row.getBoundingClientRect();
 const ph=el("div","ph");ph.style.height=r.height+"px";
 drag={row,t,ph,oy:y-r.top,y};
 row.after(ph);
 row.classList.add("lift");
 row.style.position="fixed";row.style.left=r.left+"px";row.style.top=r.top+"px";row.style.width=r.width+"px";
 document.body.classList.add("dragging");
 if(navigator.vibrate)navigator.vibrate(20);
 loop();
}
function moveDrag(y){
 if(!drag)return;drag.y=y;
 drag.row.style.top=(y-drag.oy)+"px";
 let best=null,bd=1e9;
 document.querySelectorAll(".list").forEach(l=>{const b=l.getBoundingClientRect();const d=y<b.top?b.top-y:y>b.bottom?y-b.bottom:0;if(d<bd){bd=d;best=l}});
 if(!best)return;
 const kids=[...best.children].filter(c=>c!==drag.row&&c!==drag.ph);
 let before=null;
 for(const k of kids){const b=k.getBoundingClientRect();if(y<b.top+b.height/2){before=k;break}}
 if(before)best.insertBefore(drag.ph,before);else best.appendChild(drag.ph);
}
function loop(){
 if(!drag)return;
 if(drag.y<110){scrollBy(0,-14);moveDrag(drag.y)}
 else if(drag.y>innerHeight-110){scrollBy(0,14);moveDrag(drag.y)}
 requestAnimationFrame(loop);
}
function endDrag(){
 if(!drag)return;
 const{row,t,ph}=drag;drag=null;lastDrag=Date.now();
 const list=ph.parentElement;
 if(list){
  const sib=[...list.children].filter(c=>c!==row),i=sib.indexOf(ph);
  const find=n=>n&&n.dataset?tasks.find(x=>x.id===n.dataset.id):null;
  const prev=find(sib[i-1]),next=find(sib[i+1]);
  t.p=list.dataset.p;
  t.o=prev&&next?(prev.o+next.o)/2:prev?prev.o+10:next?next.o-10:t.o;
 }
 document.body.classList.remove("dragging");
 save();render();
}
document.addEventListener("touchmove",e=>{if(!drag)return;e.preventDefault();moveDrag(e.touches[0].clientY)},{passive:false});
document.addEventListener("touchend",endDrag);
document.addEventListener("touchcancel",endDrag);

/* Formulário */
function seg(id,opts,key,color){const w=$(id);w.replaceChildren();
 opts.forEach(o=>{const b=el("button",null,o.label);if(color)b.style.setProperty("--c","var("+o.cv+")");
  b.setAttribute("aria-pressed",form[key]===o.v);b.onclick=()=>{form[key]=o.v;seg(id,opts,key,color)};w.append(b)})}
function drawCats(){const w=$("cat");w.replaceChildren();
 cats().forEach(c=>{const b=el("button",null,icon(c)+" "+c+(editCats?" ×":""));b.setAttribute("aria-pressed",!editCats&&form.c===c);
  b.onclick=()=>{if(editCats){catList=catList.filter(x=>x!==c);tasks.forEach(t=>{if(t.c===c)t.c=""});if(form.c===c)form.c="";saveCats();save();drawCats();render()}
   else{form.c=form.c===c?"":c;drawCats()}};w.append(b)});
 const m=el("button",null,editCats?"Concluir":"Editar categorias");m.style.color="var(--accent)";m.onclick=()=>{editCats=!editCats;drawCats()};w.append(m)}
function drawM(){const w=$("mseg");w.replaceChildren();
 modes.forEach(m=>{const b=el("button",null,m.emoji+" "+m.name);b.setAttribute("aria-pressed",form.modes.includes(m.id));
  b.onclick=()=>{const i=form.modes.indexOf(m.id);if(i<0)form.modes.push(m.id);else form.modes.splice(i,1);drawM()};w.append(b)});
 if(!modes.length)w.append(el("span",null,"Nenhum modo criado"))}
function setDaily(){const b=$("daily");b.textContent=form.daily?"Sim":"Não";b.setAttribute("aria-pressed",form.daily)}
function openSheet(t){
 form=t?{id:t.id,p:t.p,c:t.c,remind:t.remind||0,daily:t.daily,modes:[...t.modes]}
       :{id:null,p:"media",c:cats()[0]||"",remind:0,daily:false,modes:cur==="all"?[]:[cur]};
 $("sheetTitle").textContent=t?"Editar tarefa":"Nova tarefa";
 $("title").value=t?t.t:"";$("time").value=t?t.time:"";$("newcat").value="";
 $("remove").style.display=t?"block":"none";
 seg("pri",Object.keys(PRI).map(k=>({v:k,label:PRI[k].s,cv:PRI[k].v})),"p",true);
 editCats=false;drawCats();drawM();
 seg("remind",REMINDS,"remind",false);setDaily();
 $("scrim").classList.add("on");
 if(!t)setTimeout(()=>$("title").focus(),50)}
const closeSheet=()=>$("scrim").classList.remove("on");
$("add").onclick=()=>openSheet(null);
$("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};
$("daily").onclick=()=>{form.daily=!form.daily;setDaily()};
$("save").onclick=()=>{
 const t=$("title").value.trim();if(!t){$("title").focus();return}
 const c=$("newcat").value.trim()||form.c,time=$("time").value;
 if(c&&!catList.includes(c)){catList.push(c);saveCats()}
 if(form.id){const x=tasks.find(z=>z.id===form.id);Object.assign(x,{t,p:form.p,c,time,remind:form.remind,daily:form.daily,modes:form.modes,done:false,doneOn:""})}
 else{const mx=tasks.reduce((a,z)=>Math.max(a,z.o),0);tasks.push({id:uid(),nid:nid(),t,p:form.p,c,time,remind:form.remind,daily:form.daily,modes:form.modes,o:mx+10,done:false,doneOn:""})}
 save();closeSheet();render()};
$("remove").onclick=()=>{tasks=tasks.filter(x=>x.id!==form.id);save();closeSheet();render()};

/* Modos */
function drawML(){const w=$("mlist");w.replaceChildren();
 modes.forEach(m=>{const r=el("div","mrow");
  const e=el("input");e.type="text";e.value=m.emoji;e.maxLength=4;e.oninput=()=>{m.emoji=e.value;saveModes()};
  const n=el("input");n.type="text";n.value=m.name;n.maxLength=20;n.oninput=()=>{m.name=n.value;saveModes()};
  const d=el("button","del","×");d.setAttribute("aria-label","Excluir modo");
  d.onclick=()=>{modes=modes.filter(x=>x.id!==m.id);tasks.forEach(t=>{t.modes=t.modes.filter(i=>i!==m.id)});if(cur===m.id)cur="all";saveModes();save();drawML()};
  r.append(e,n,d);w.append(r)})}
function openModes(){drawML();$("mscrim").classList.add("on")}
$("addMode").onclick=()=>{modes.push({id:"m"+uid(),name:"Novo modo",emoji:"⭐"});saveModes();drawML()};
$("mdone").onclick=()=>{$("mscrim").classList.remove("on");render();schedule()};
$("mscrim").onclick=e=>{if(e.target.id==="mscrim")$("mdone").onclick()};

$("theme").onclick=()=>{const r=document.documentElement;
 const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("rotina.theme",r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem("rotina.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
load();render();schedule();
setInterval(()=>{if(!drag)hero(tasks.filter(inMode))},60000);
</script>
</body>
